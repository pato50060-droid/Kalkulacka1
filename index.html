
<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTC Kalkulačka</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23f7931a'/%3E%3Cpath d='M63 .672c-4.425-1.125-9.3-.15-12.3 2.55s-3.75 6.6-2.55 10.8c.45 1.5 1.125 3 1.95 4.35L42.3 21a5.64 5.64 0 0 0-4.05-1.65c-2.4 0-4.5 1.5-5.25 3.75l-4.2 12.45a5.54 5.54 0 0 0 .9 5.1c1.5 1.95 3.9 2.7 6.3 2.1l7.8-2.1-3 9.15-7.8 2.1a5.55 5.55 0 0 0-3.9 3.9 5.54 5.54 0 0 0 .9 5.1c1.5 1.95 3.9 2.7 6.3 2.1l7.8-2.1-4.35 13.05a5.71 5.71 0 0 0 .9 5.1c1.5 1.95 3.9 2.7 6.3 2.1l4.2-12.45c3.6 1.05 7.35 1.8 11.1 2.25l-4.35 13.05a5.71 5.71 0 0 0 .9 5.1c1.5 1.95 3.9 2.7 6.3 2.1l4.2-12.6c5.25-.3 10.35-1.5 15.15-3.6 8.55-3.75 13.05-11.25 11.55-21.3-1.05-6.6-5.4-11.25-11.55-13.65 4.65-2.7 7.5-7.35 7.05-14.1-.6-8.55-6.6-13.95-16.05-15.6zm-7.65 17.55c4.65 0 8.1 3.15 8.55 7.65s-2.1 8.55-6.75 9l-9.15 2.5 4.35-13.2 3-5.95zm-4.95 24.15l9.45-2.55c5.1-.3 8.7 3.3 9.15 8.4-.45 5.4-4.3 8.55-9.45 8.7l-9.6 2.55 4.45-17.1z' fill='%23fff' transform='matrix%281.1 0 0 1.1 -5 -5%29'/%3E%3C/svg%3E">
    
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .calculator {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 30px;
        }
        .pair {
            color: #ff9900;
            font-weight: bold;
            font-size: 22px;
            margin-bottom: 25px;
        }
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .label {
            font-size: 18px;
            font-weight: bold;
            width: 35%;
        }
        .input-container {
            width: 60%;
        }
        input {
            width: 100%;
            padding: 10px 15px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            background-color: #ff9900;
            color: #ffffff;
            text-align: right;
            box-sizing: border-box;
        }
        .result-box {
            background-color: #ff9900;
            color: #ffffff;
            width: 60%;
            padding: 10px 15px;
            font-size: 18px;
            font-weight: bold;
            text-align: right;
            box-sizing: border-box;
        }
        .output-box {
            color: #ffffff;
            width: 60%;
            padding: 10px 15px;
            font-weight: bold;
            text-align: right;
            box-sizing: border-box;
        }
        .btc-text {
            font-size: 20px;
        }
        .sats-text {
            font-size: 24px;
        }
    </style>
</head>
<body>

<div class="calculator">
    <h1>Kalkulačka</h1>
    <div class="pair">BTC/EUR</div>

    <div class="row">
        <div class="label">Aktuálny kurz</div>
        <div class="input-container">
            <input type="text" id="kurz" value="59 030 €" oninput="spracujVstup(this)" onblur="sformatujNaKoniec(this)">
        </div>
    </div>

    <div class="row">
        <div class="label">3%</div>
        <div class="result-box" id="kurzSPercentami">60 801 €</div>
    </div>

    <br>

    <div class="row">
        <div class="label">Nákup</div>
        <div class="input-container">
            <input type="text" id="nakup" value="100 €" oninput="spracujVstup(this)" onblur="sformatujNaKoniec(this)">
        </div>
    </div>

    <div class="row">
        <div class="label btc-text">BTC</div>
        <div class="output-box btc-text" id="vysledokBTC">0,001644712 BTC</div>
    </div>

    <div class="row">
        <div class="label sats-text">SATS</div>
        <div class="output-box sats-text" id="vysledokSATS">164 471 SATS</div>
    </div>
</div>

<script>
    function ziskajCislo(text) {
        let ocistene = text.replace(/[^0-9]/g, '');
        return parseFloat(ocistene) || 0;
    }

    function spracujVstup(element) {
        let cislo = ziskajCislo(element.value);
        if (cislo === 0) {
            element.value = '';
        } else {
            element.value = cislo.toLocaleString('sk-SK');
        }
        prepocitaj();
    }

    function sformatujNaKoniec(element) {
        let cislo = ziskajCislo(element.value);
        if (cislo > 0) {
            element.value = cislo.toLocaleString('sk-SK') + ' €';
        } else {
            element.value = '0 €';
        }
    }

    function prepocitaj() {
        const kurz = ziskajCislo(document.getElementById('kurz').value);
        const nakup = ziskajCislo(document.getElementById('nakup').value);

        const kurzSPercentami = kurz + (kurz * 0.03);
        
        document.getElementById('kurzSPercentami').innerText = 
            Math.round(kurzSPercentami).toLocaleString('sk-SK') + ' €';

        if (kurzSPercentami === 0) {
            document.getElementById('vysledokBTC').innerText = '0,000000000 BTC';
            document.getElementById('vysledokSATS').innerText = '0 SATS';
            return;
        }

        const btc = nakup / kurzSPercentami;
        const sats = Math.round(btc * 100000000);

        document.getElementById('vysledokBTC').innerText = 
            btc.toFixed(9).replace('.', ',') + ' BTC';
        
        document.getElementById('vysledokSATS').innerText = 
            sats.toLocaleString('sk-SK') + ' SATS';
    }
</script>

</body>
</html>
