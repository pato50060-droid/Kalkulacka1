<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTC Kalkulačka</title>
    
    <!-- TENTO KÓD VYTVORÍ UNIKÁTNU IKONU: KOMBINÁCIA BITCOINU A KALKULAČKY -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23f7931a'/%3E%3Cpath d='M32 24h36v12H32z' fill='%23fff' opacity='.2'/%3E%3Cpath d='M60 41.5c-2.5-.6-5.3-.1-7 1.5s-2.1 3.8-1.5 6.2c.3.9.6 1.7 1.1 2.5l-6.3 1.7c-.9-.6-2-.9-3.2-.9-1.9 0-3.6.9-4.2 2.1l-3.4 10c-.4 1.1.2 2.3 1.3 2.7.2.1.5.1.7.1 1 0 1.9-.7 2.1-1.7l3.4-10c.5-.1 1.1-.3 1.6-.6l6.3-1.7-1.7 5.2-6.3 1.7c-.7.2-1.2.7-1.4 1.4-.2.7.1 1.4.6 1.9l2.7 2c.5.4 1.2.5 1.8.3l6.3-1.7-2.5 7.4c-.4 1.1.2 2.3 1.3 2.7.2.1.5.1.7.1 1 0 1.9-.7 2.1-1.7l2.4-7.2c2.1.6 4.2 1 6.3 1.3l-2.5 7.4c-.4 1.1.2 2.3 1.3 2.7.2.1.5.1.7.1 1 0 1.9-.7 2.1-1.7l2.4-7.2c3-.2 5.9-.9 8.6-2.1 4.9-2.1 7.4-6.4 6.6-12.1-.6-3.8-3.1-6.4-6.6-7.8 2.6-1.5 4.3-4.2 4-8.1-.3-4.9-3.8-8-9.2-8.9zm-4.4 10c2.6 0 4.6 1.8 4.9 4.4s-1.2 4.9-3.8 5.1l-5.2 1.4 2.5-7.5 1.6-3.4zm-2.8 13.8l5.4-1.5c2.9-.2 5 1.9 5.2 4.8-.3 3.1-2.5 4.9-5.4 5l-5.5 1.5 2.5-9.8z' fill='%23fff'/%3E%3Crect x='32' y='20' width='36' height='48' rx='4' fill='none' stroke='%23fff' stroke-width='4'/%3E%3Ccircle cx='39' cy='56' r='2.5' fill='%23fff'/%3E%3Ccircle cx='39' cy='62' r='2.5' fill='%23fff'/%3E%3Ccircle cx='46' cy='62' r='2.5' fill='%23fff'/%3E%3C/svg%3E">
    
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .calculator {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 30px;
        }
        .pair {
            color: #ff9900;
            font-weight: bold;
            font-size: 22px;
            margin-bottom: 25px;
        }
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .label {
            font-size: 18px;
            font-weight: bold;
            width: 35%;
        }
        .input-container {
            width: 60%;
        }
        input {
            width: 100%;
            padding: 10px 15px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            background-color: #ff9900;
            color: #ffffff;
            text-align: right;
            box-sizing: border-box;
        }
        .result-box {
            background-color: #ff9900;
            color: #ffffff;
            width: 60%;
            padding: 10px 15px;
            font-size: 18px;
            font-weight: bold;
            text-align: right;
            box-sizing: border-box;
        }
        .output-box {
            color: #ffffff;
            width: 60%;
            padding: 10px 15px;
            font-weight: bold;
            text-align: right;
            box-sizing: border-box;
        }
        .btc-text {
            font-size: 20px;
        }
        .sats-text {
            font-size: 24px;
        }
    </style>
</head>
<body>

<div class="calculator">
    <h1>Kalkulačka</h1>
    <div class="pair">BTC/EUR</div>

    <!-- 1. RIADOK: Aktuálny kurz -->
    <div class="row">
        <div class="label">Aktuálny kurz</div>
        <div class="input-container">
            <input type="text" id="kurz" value="59 030 €" oninput="spracujVstup(this)" onblur="sformatujNaKoniec(this)">
        </div>
    </div>

    <!-- 2. RIADOK: Pripočítané 3% -->
    <div class="row">
        <div class="label">3%</div>
        <div class="result-box" id="kurzSPercentami">60 801 €</div>
    </div>

    <br>

    <!-- 3. RIADOK: Nákup -->
    <div class="row">
        <div class="label">Nákup</div>
        <div class="input-container">
            <input type="text" id="nakup" value="100 €" oninput="spracujVstup(this)" onblur="sformatujNaKoniec(this)">
        </div>
    </div>

    <!-- 4. RIADOK: Výsledok v BTC -->
    <div class="row">
        <div class="label btc-text">BTC</div>
        <div class="output-box btc-text" id="vysledokBTC">0,001644712 BTC</div>
    </div>

    <!-- 5. RIADOK: Výsledok v SATS -->
    <div class="row">
        <div class="label sats-text">SATS</div>
        <div class="output-box sats-text" id="vysledokSATS">164 471 SATS</div>
    </div>
</div>

<script>
    function ziskajCislo(text) {
        let ocistene = text.replace(/[^0-9]/g, '');
        return parseFloat(ocistene) || 0;
    }

    function spracujVstup(element) {
        let cislo = ziskajCislo(element.value);
        if (cislo === 0) {
            element.value = '';
        } else {
            element.value = cislo.toLocaleString('sk-SK');
        }
        prepocitaj();
    }

    function sformatujNaKoniec(element) {
        let cislo = ziskajCislo(element.value);
        if (cislo > 0) {
            element.value = cislo.toLocaleString('sk-SK') + ' €';
        } else {
            element.value = '0 €';
        }
    }

    function prepocitaj() {
        const kurz = ziskajCislo(document.getElementById('kurz').value);
        const nakup = ziskajCislo(document.getElementById('nakup').value);

        const kurzSPercentami = kurz + (kurz * 0.03);
        
        document.getElementById('kurzSPercentami').innerText = 
            Math.round(kurzSPercentami).toLocaleString('sk-SK') + ' €';

        if (kurzSPercentami === 0) {
            document.getElementById('vysledokBTC').innerText = '0,000000000 BTC';
            document.getElementById('vysledokSATS').innerText = '0 SATS';
            return;
        }

        const btc = nakup / kurzSPercentami;
        const sats = Math.round(btc * 100000000);

        document.getElementById('vysledokBTC').innerText = 
            btc.toFixed(9).replace('.', ',') + ' BTC';
        
        document.getElementById('vysledokSATS').innerText = 
            sats.toLocaleString('sk-SK') + ' SATS';
    }
</script>

</body>
</html>
