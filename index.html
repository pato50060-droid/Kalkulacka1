<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTC Kalkulačka</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23F7931A'/%3E%3Ctext x='50%25' y='50%25' dy='.33em' font-family='Arial Black, Arial, sans-serif' font-size='65' font-weight='900' fill='%23000000' dominant-baseline='central' text-anchor='middle'%3EB%3C/text%3E%3C/svg%3E">

    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .calculator {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 30px;
        }
        .pair {
            color: #ff9900;
            font-weight: bold;
            font-size: 22px;
            margin-bottom: 25px;
        }
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .label {
            font-size: 18px;
            font-weight: bold;
            width: 35%;
        }
        .input-container {
            width: 60%;
        }
        input {
            width: 100%;
            padding: 10px 15px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            background-color: #ff9900;
            color: #ffffff;
            text-align: right;
            box-sizing: border-box;
        }
        .output-box {
            color: #ffffff;
            width: 60%;
            padding: 10px 15px;
            font-weight: bold;
            text-align: right;
            box-sizing: border-box;
        }
        /* ŠTÝL PRE NOVÝ KURZ - VEĽKÝ A ČITATEĽNÝ */
        .new-rate-box {
            color: #ffffff;
            width: 60%;
            padding: 10px 15px;
            font-size: 18px;
            font-weight: bold;
            text-align: right;
            box-sizing: border-box;
        }
        .btc-text {
            font-size: 20px;
        }
        .sats-text {
            font-size: 24px;
        }
    </style>
</head>
<body>

<div class="calculator">
    <h1>Kalkulačka</h1>
    <div class="pair">BTC/EUR</div>

    <!-- 1. RIADOK: Aktuálny kurz -->
    <div class="row">
        <div class="label">Aktuálny kurz</div>
        <div class="input-container">
            <input type="text" id="kurz" value="59 030 €" oninput="spracujVstupCena(this)" onblur="sformatujNaKoniecCena(this)">
        </div>
    </div>

    <!-- 2. RIADOK: Nastavenie percent -->
    <div class="row">
        <div class="label">Percentá</div>
        <div class="input-container">
            <input type="text" id="percenta" value="3 %" oninput="spracujVstupPercenta(this)" onblur="sformatujNaKoniecPercenta(this)">
        </div>
    </div>

    <!-- NOVÝ UPRAVENÝ RIADOK: Nový kurz s veľkým písmom -->
    <div class="row" style="margin-bottom: 25px;">
        <div class="label" style="color: #aaaaaa; font-size: 16px;">Nový kurz</div>
        <div class="new-rate-box" id="kurzSPercentami">60 801 €</div>
    </div>

    <!-- 3. RIADOK: Nákup -->
    <div class="row">
        <div class="label">Nákup</div>
        <div class="input-container">
            <input type="text" id="nakup" value="100 €" oninput="spracujVstupCena(this)" onblur="sformatujNaKoniecCena(this)">
        </div>
    </div>

    <!-- 4. RIADOK: Výsledok v BTC -->
    <div class="row">
        <div class="label btc-text">BTC</div>
        <div class="output-box btc-text" id="vysledokBTC">0,001644712 BTC</div>
    </div>

    <!-- 5. RIADOK: Výsledok v SATS -->
    <div class="row">
        <div class="label sats-text">SATS</div>
        <div class="output-box sats-text" id="vysledokSATS">164 471 SATS</div>
    </div>
</div>

<script>
    function ziskajCislo(text) {
        let ocistene = text.replace(/[^0-9]/g, '');
        return parseFloat(ocistene) || 0;
    }

    function spracujVstupCena(element) {
        let cislo = ziskajCislo(element.value);
        if (cislo === 0) {
            element.value = '';
        } else {
            element.value = cislo.toLocaleString('sk-SK');
        }
        prepocitaj();
    }

    function sformatujNaKoniecCena(element) {
        let cislo = ziskajCislo(element.value);
        if (cislo > 0) {
            element.value = cislo.toLocaleString('sk-SK') + ' €';
        } else {
            element.value = '0 €';
        }
    }

    function spracujVstupPercenta(element) {
        let cislo = ziskajCislo(element.value);
        if (cislo === 0) {
            element.value = '';
        } else {
            element.value = cislo;
        }
        prepocitaj();
    }

    function sformatujNaKoniecPercenta(element) {
        let cislo = ziskajCislo(element.value);
        element.value = cislo + ' %';
    }

    function prepocitaj() {
        const kurz = ziskajCislo(document.getElementById('kurz').value);
        const percenta = ziskajCislo(document.getElementById('percenta').value);
        const nakup = ziskajCislo(document.getElementById('nakup').value);

        const kurzSPercentami = kurz + (kurz * (percenta / 100));
        
        document.getElementById('kurzSPercentami').innerText = 
            Math.round(kurzSPercentami).toLocaleString('sk-SK') + ' €';

        if (kurzSPercentami === 0) {
            document.getElementById('vysledokBTC').innerText = '0,000000000 BTC';
            document.getElementById('vysledokSATS').innerText = '0 SATS';
            return;
        }

        const btc = nakup / kurzSPercentami;
        const sats = Math.round(btc * 100000000);

        document.getElementById('vysledokBTC').innerText = 
            btc.toFixed(9).replace('.', ',') + ' BTC';
        
        document.getElementById('vysledokSATS').innerText = 
            sats.toLocaleString('sk-SK') + ' SATS';
    }
</script>

</body>
</html>
